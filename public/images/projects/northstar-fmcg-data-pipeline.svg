<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 560" role="img" aria-labelledby="title desc">
  <title id="title">NorthStar FMCG data pipeline</title>
  <desc id="desc">Three Excel workbooks with five sheets flow into a preserved raw copy, data quality rules, clean staging, a curated star schema, and thirteen reporting views. Rejected rows are quarantined and run logs support reconciliation.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 10 5 0 10z" fill="#3f3f46"/>
    </marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1f2937" flood-opacity=".12"/>
    </filter>
    <style>
      .node{fill:#f0edff;stroke:#8b68ef;stroke-width:2}
      .label{font:600 24px system-ui,-apple-system,Segoe UI,sans-serif;fill:#20202a;text-anchor:middle}
      .small{font:500 19px system-ui,-apple-system,Segoe UI,sans-serif;fill:#383747;text-anchor:middle}
      .edge{fill:none;stroke:#45454d;stroke-width:2.5;marker-end:url(#arrow)}
      .audit{fill:none;stroke:#66616f;stroke-width:2;stroke-dasharray:4 7;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1500" height="560" fill="#fff"/>
  <text x="44" y="45" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="15" font-weight="700" letter-spacing="3" fill="#7251d3">NORTHSTAR · FMCG DATA FLOW</text>

  <g filter="url(#shadow)">
    <rect class="node" x="28" y="258" width="190" height="102" rx="8"/>
    <rect class="node" x="270" y="258" width="190" height="102" rx="8"/>
    <rect class="node" x="820" y="70" width="190" height="100" rx="8"/>
    <rect class="node" x="1055" y="70" width="190" height="100" rx="8"/>
    <rect class="node" x="1290" y="55" width="180" height="130" rx="8"/>
    <rect class="node" x="820" y="220" width="190" height="104" rx="8"/>
  </g>

  <path class="edge" d="M218 309h42"/>
  <path class="edge" d="M460 309h36"/>
  <path class="edge" d="M745 222h48q22 0 22-22V120h-18"/>
  <path class="edge" d="M1010 120h37"/>
  <path class="edge" d="M1245 120h37"/>
  <path class="edge" d="M745 270h58"/>
  <path class="audit" d="M460 331h27q18 0 18 18v114h749q18 0 18-18V396h18"/>
  <path class="audit" d="M745 301h47q18 0 18 18v144h467q18 0 18-18V396h18"/>

  <polygon class="node" filter="url(#shadow)" points="620,95 765,240 620,385 475,240"/>

  <text class="label" x="123" y="299">Excel workbooks</text>
  <text class="small" x="123" y="331">3 files · 5 sheets</text>
  <text class="label" x="365" y="299">Raw</text>
  <text class="small" x="365" y="331">untouched copy</text>
  <text class="label" x="620" y="200">Data quality</text>
  <text class="label" x="620" y="231">rules</text>
  <text class="small" x="620" y="263">fix · flag ·</text>
  <text class="small" x="620" y="291">quarantine</text>
  <text class="label" x="915" y="112">Staging</text>
  <text class="small" x="915" y="143">clean rows</text>
  <text class="label" x="1150" y="112">Curated</text>
  <text class="small" x="1150" y="143">star schema</text>
  <text class="label" x="1380" y="97">Analytics</text>
  <text class="small" x="1380" y="129">13 reporting</text>
  <text class="small" x="1380" y="158">views</text>
  <text class="label" x="915" y="259">Quarantine</text>
  <text class="small" x="915" y="289">rejected rows</text>
  <text class="small" x="915" y="314">+ reason</text>

  <g filter="url(#shadow)">
    <path d="M1280 390c0-18 38-32 85-32s85 14 85 32v78c0 18-38 32-85 32s-85-14-85-32z" fill="#f0edff" stroke="#8b68ef" stroke-width="2"/>
    <ellipse cx="1365" cy="390" rx="85" ry="31" fill="#f0edff" stroke="#8b68ef" stroke-width="2"/>
    <path d="M1280 468c0 18 38 32 85 32s85-14 85-32" fill="none" stroke="#8b68ef" stroke-width="2"/>
  </g>
  <text class="label" x="1365" y="423">Audit</text>
  <text class="small" x="1365" y="453">run logs &amp;</text>
  <text class="small" x="1365" y="480">reconciliation</text>
</svg>
